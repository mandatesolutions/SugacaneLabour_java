<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Labor Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            padding: 20px;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            background-color: #f9f9f9;
        }

        h2 {
            text-align: center;
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 5px;
        }

        .section {
            margin-top: 20px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .label {
            font-weight: bold;
            color: #333;
        }

        .value {
            color: #666;
        }

        .info-box {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .info-box:last-child {
            border-bottom: none;
        }

        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        td a {
            color: #007bff;
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h2>Labor Details</h2>

    <div class="section">
        <h3>Basic Information</h3>
        <div class="info-box">
            <span class="label">User ID:</span>
            <span class="value" th:text="${userId}"></span>
        </div>
        <div class="info-box">
            <span class="label">Email:</span>
            <span class="value" th:text="${email}"></span>
        </div>
        <div class="info-box">
            <span class="label">Role:</span>
            <span class="value" th:text="${role}"></span>
        </div>
        <div class="info-box">
            <span class="label">Mobile:</span>
            <span class="value" th:text="${mobileNo}"></span>
        </div>
    </div>

    <div class="section">
        <h3>Personal Details</h3>
        <div class="info-box">
            <span class="label">Name:</span>
            <span class="value" th:text="${firstName} + ' ' + ${lastName}"></span>
        </div>
        <div class="info-box">
            <span class="label">Gender:</span>
            <span class="value" th:text="${gender}"></span>
        </div>
        <div class="info-box">
            <span class="label">Blood Group:</span>
            <span class="value" th:text="${bloodGroup}"></span>
        </div>
        <div class="info-box">
            <span class="label">Address:</span>
            <span class="value" th:text="${address}"></span>
        </div>
        <div class="info-box">
            <span class="label">District ID:</span>
            <span class="value" th:text="${districtId}"></span>
        </div>
        <div class="info-box">
            <span class="label">Taluka ID:</span>
            <span class="value" th:text="${talukaId}"></span>
        </div>
        <div class="info-box">
            <span class="label">Age:</span>
            <span class="value" th:text="${age}"></span>
        </div>
        <div class="info-box">
            <span class="label">Family Members:</span>
            <span class="value" th:text="${familyMembers}"></span>
        </div>
        <div class="info-box">
            <span class="label">Medical History:</span>
            <span class="value" th:text="${medicalHistory}"></span>
        </div>
        <div class="info-box">
            <span class="label">Unique Labor ID:</span>
            <span class="value" th:text="${uniqueLaborId}"></span>
        </div>
    </div>

    <div class="section">
        <h3>Documents</h3>
        <div class="table-container">
            <table>
                <tr>
                    <th>Document Type</th>
                    <th>Document Link</th>
                </tr>
                <tr th:each="doc : ${documents}">
                    <td th:text="${doc.documentType}"></td>
                    <td><a th:href="${doc.documentLink}" th:text="${doc.documentLink}" target="_blank"></a></td>
                </tr>
            </table>
        </div>
    </div>

</body>

</html>
